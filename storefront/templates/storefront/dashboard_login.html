{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Admin Login — {{ store.name|default:"Retail Platform" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --admin-bg: #f8fafc;
            --admin-card: #ffffff;
            --admin-primary: #3b82f6;
            --admin-primary-hover: #2563eb;
            --admin-text: #0f172a;
            --admin-muted: #64748b;
            --admin-border: rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--admin-bg);
            color: var(--admin-text);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* Abstract glowing background effects */
        body::before {
            content: '';
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, rgba(248,250,252,0) 70%);
            top: -200px;
            right: -200px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, rgba(248,250,252,0) 70%);
            bottom: -200px;
            left: -100px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }

        .admin-login-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
        }

        .admin-login-card {
            background-color: var(--admin-card);
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(0, 0, 0, 0.05);
        }

        .admin-logo {
            text-align: center;
            margin-bottom: 32px;
        }

        .admin-logo i {
            font-size: 42px;
            color: var(--admin-primary);
            margin-bottom: 16px;
        }

        .admin-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--admin-text);
            letter-spacing: -0.5px;
        }

        .admin-subtitle {
            font-size: 14px;
            color: var(--admin-muted);
            margin: 0;
        }

        .admin-form-group {
            margin-bottom: 24px;
        }

        .admin-form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--admin-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .admin-form-control {
            width: 100%;
            background: #ffffff;
            border: 1px solid var(--admin-border);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 15px;
            color: var(--admin-text);
            font-family: inherit;
            transition: all 0.2s;
        }

        .admin-form-control:focus {
            outline: none;
            border-color: var(--admin-primary);
            box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
            background: #ffffff;
        }

        .admin-btn-submit {
            width: 100%;
            background-color: var(--admin-primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .admin-btn-submit:hover {
            background-color: var(--admin-primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59,130,246,0.3);
        }

        .admin-btn-submit:active {
            transform: translateY(0);
        }

        .admin-alert {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .admin-alert.success {
            background: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }

        .admin-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--admin-muted);
        }
        
        .admin-footer a {
            color: var(--admin-primary);
            text-decoration: none;
            transition: color 0.2s;
        }
        
        .admin-footer a:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="admin-login-wrapper">
        <div class="admin-login-card">
            <div class="admin-logo">
                <i class="fas fa-shield-halved"></i>
                <h1 class="admin-title">Admin Portal</h1>
                <p class="admin-subtitle">Secure access for {{ store.name|default:"Super Admins" }}</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                <div class="admin-alert {% if message.tags == 'success' %}success{% endif %}">
                    <i class="fas {% if message.tags == 'success' %}fa-check-circle{% else %}fa-exclamation-triangle{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}

            <form method="POST" action="">
                {% csrf_token %}
                <div class="admin-form-group">
                    <label for="username">Admin Username</label>
                    <input type="text" id="username" name="username" class="admin-form-control" placeholder="Enter administrator username" required autocomplete="username">
                </div>

                <div class="admin-form-group">
                    <label for="password">Security Password</label>
                    <input type="password" id="password" name="password" class="admin-form-control" placeholder="• • • • • • • •" required autocomplete="current-password">
                </div>

                <button type="submit" class="admin-btn-submit">
                    Authenticate <i class="fas fa-arrow-right-to-bracket"></i>
                </button>
            </form>
        </div>
        
        <div class="admin-footer">
            <i class="fas fa-lock" style="font-size: 10px; opacity: 0.7; margin-right: 4px;"></i> 
            Secured Portal. <a href="{% url 'storefront:home' %}">Return to Storefront</a>
        </div>
    </div>

</body>
</html>
