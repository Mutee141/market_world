<!-- ========== CATEGORY CIRCLE BUBBLES STRIP (Computer Zone Style) ========== -->
{% if categories or nav_categories %}
<section class="category-circle-strip-section">
  <div class="container">
    <div class="category-circle-carousel owl-carousel owl-theme">
      {% for cat in categories|default:nav_categories %}
      <div class="item">
        <a href="{% url 'storefront:shop' %}?category={{ cat.slug }}" class="cat-circle-item">
          <div class="cat-circle-frame">
            {% if cat.image %}
            <img src="{{ cat.image.url }}" alt="{{ cat.name }}" class="cat-circle-img">
            {% else %}
            <i class="fas {% if 'grocery' in cat.slug or 'food' in cat.slug %}fa-shopping-basket{% elif 'electronics' in cat.slug %}fa-laptop{% elif 'mobile' in cat.slug or 'phone' in cat.slug %}fa-mobile-alt{% elif 'computer' in cat.slug or 'casing' in cat.slug %}fa-desktop{% elif 'fashion' in cat.slug or 'clothing' in cat.slug %}fa-tshirt{% elif 'footwear' in cat.slug or 'shoe' in cat.slug %}fa-shoe-prints{% elif 'beauty' in cat.slug %}fa-pump-soap{% elif 'home' in cat.slug %}fa-couch{% elif 'kitchen' in cat.slug %}fa-utensils{% elif 'cleaning' in cat.slug %}fa-broom{% elif 'baby' in cat.slug %}fa-baby{% elif 'pet' in cat.slug %}fa-dog{% elif 'sports' in cat.slug %}fa-dumbbell{% elif 'gaming' in cat.slug or 'console' in cat.slug %}fa-gamepad{% elif 'headset' in cat.slug or 'mic' in cat.slug or 'audio' in cat.slug %}fa-headphones{% elif 'camera' in cat.slug or 'drone' in cat.slug %}fa-camera{% elif 'keyboard' in cat.slug or 'mouse' in cat.slug %}fa-keyboard{% elif 'wearable' in cat.slug or 'watch' in cat.slug %}fa-stopwatch{% elif 'cooling' in cat.slug or 'fan' in cat.slug %}fa-fan{% else %}fa-box-open{% endif %} cat-circle-icon"></i>
            {% endif %}
          </div>
          <span class="cat-circle-label">{{ cat.name }}</span>
        </a>
      </div>
      {% endfor %}
    </div>
  </div>
</section>

<style>
  .category-circle-strip-section {
    padding: 32px 0 28px;
    background: #ffffff;
    border-bottom: 1px solid #e2e8f0;
  }

  .category-circle-carousel .owl-stage-outer {
    padding: 10px 0 12px;
  }

  .cat-circle-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    cursor: pointer;
  }

  .cat-circle-frame {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #ffffff;
    border: 2px solid #e2e8f0;
    box-shadow: 0 6px 18px rgba(15, 23, 42, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    position: relative;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .cat-circle-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    transition: transform 0.35s ease;
  }

  .cat-circle-icon {
    font-size: 42px;
    color: #334155;
    transition: all 0.3s ease;
  }

  .cat-circle-item:hover .cat-circle-frame {
    transform: translateY(-6px) scale(1.06);
    background: #ffffff;
    border-color: #0f172a;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.15);
  }

  .cat-circle-item:hover .cat-circle-img {
    transform: scale(1.12);
  }

  .cat-circle-item:hover .cat-circle-icon {
    color: #0f172a;
    transform: scale(1.12);
  }

  .cat-circle-label {
    margin-top: 12px;
    font-size: 13.5px;
    font-weight: 700;
    color: #1e293b;
    text-align: center;
    line-height: 1.35;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    max-width: 130px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: color 0.2s ease;
  }

  .cat-circle-item:hover .cat-circle-label {
    color: #0f172a;
  }

  /* Carousel Dots computer zone style */
  .category-circle-carousel .owl-dots {
    display: flex !important;
    flex-direction: row !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 6px !important;
    margin-top: 18px !important;
    text-align: center !important;
  }

  .category-circle-carousel .owl-dot {
    display: inline-block !important;
    outline: none !important;
    border: none !important;
    background: transparent !important;
    padding: 0 !important;
  }

  .category-circle-carousel .owl-dot span {
    width: 8px !important;
    height: 8px !important;
    margin: 0 !important;
    background: #cbd5e1 !important;
    display: block !important;
    border-radius: 50% !important;
    transition: all 0.3s ease !important;
  }

  .category-circle-carousel .owl-dot.active span,
  .category-circle-carousel .owl-dot:hover span {
    background: #0f172a !important;
    width: 24px !important;
    border-radius: 99px !important;
  }

  @media (max-width: 768px) {
    .category-circle-strip-section {
      padding: 20px 0 16px;
    }
    .cat-circle-frame {
      width: 80px;
      height: 80px;
      padding: 3px;
    }
    .cat-circle-icon {
      font-size: 26px;
    }
    .cat-circle-label {
      font-size: 11px;
      max-width: 90px;
      margin-top: 8px;
    }
    .category-circle-carousel .owl-dots {
      margin-top: 12px !important;
    }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    if (typeof $ !== 'undefined' && $.fn.owlCarousel) {
      $('.category-circle-carousel').owlCarousel({
        loop: false,
        margin: 18,
        nav: false,
        dots: true,
        responsive: {
          0: { items: 3, margin: 10 },
          576: { items: 4, margin: 14 },
          768: { items: 6, margin: 18 },
          992: { items: 7, margin: 20 },
          1200: { items: 8, margin: 22 }
        }
      });
    }
  });
</script>
{% endif %}
